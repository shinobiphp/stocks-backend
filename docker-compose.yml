version: '3.8'

services:
  app:
    image: openswoole/openswoole:26.2-php8.5-alpine
    container_name: bigstocks_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - TZ=America/New_York
    command: php server.php # Or your OpenSwoole boot script

  node-builder:
    image: node:20-alpine
    container_name: bigstocks_builder
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # Keeps container alive to run builds on demand or via your API/NATS workers
    command: tail -f /dev/null
